<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Accesos Remotos</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }
        
        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .device-card {
            background: #f8f9fa;
            border-left: 5px solid #667eea;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            position: relative;
        }
        
        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .device-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }
        
        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            color: white;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .badge-anydesk { background: #ef4444; }
        .badge-rustdesk { background: #3b82f6; }
        .badge-airdroid { background: #10b981; }
        
        .device-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .info-item {
            background: white;
            padding: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .info-label {
            font-weight: 600;
            color: #666;
        }
        
        .info-value {
            color: #333;
            cursor: pointer;
            padding: 5px 10px;
            background: #e0e7ff;
            border-radius: 4px;
            transition: background 0.3s;
        }
        
        .info-value:hover {
            background: #c7d2fe;
        }
        
        .action-buttons {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
        }
        
        .edit-btn, .delete-btn {
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85em;
            width: auto;
            transition: all 0.3s;
        }
        
        .edit-btn {
            background: #f59e0b;
            color: white;
        }
        
        .edit-btn:hover {
            background: #d97706;
            transform: translateY(-2px);
        }
        
        .delete-btn {
            background: #ef4444;
            color: white;
        }
        
        .delete-btn:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }
        
        .notes {
            margin-top: 10px;
            padding: 10px;
            background: #fef3c7;
            border-radius: 6px;
            font-size: 0.9em;
            color: #92400e;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .error-box {
            background: #fee2e2;
            border: 2px solid #ef4444;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            color: #991b1b;
        }
        
        .error-box h3 {
            margin-bottom: 10px;
        }
        
        .success-box {
            background: #d1fae5;
            border: 2px solid #10b981;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            color: #065f46;
        }
        
        .status-box {
            background: #dbeafe;
            border: 2px solid #3b82f6;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            color: #1e40af;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            animation: fadeIn 0.3s;
        }
        
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideDown 0.3s;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        
        .modal-header h2 {
            color: #333;
        }
        
        .close-btn {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            width: auto;
            padding: 0;
            background: none;
        }
        
        .close-btn:hover {
            color: #000;
            transform: none;
            box-shadow: none;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @media (max-width: 768px) {
            .form-row, .device-info {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .modal-content {
                margin: 10% auto;
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖥️ Gestor de Accesos Remotos </h1>
        
        <!-- Mensajes de estado -->
        <div id="statusMessages"></div>
        
        <!-- Formulario -->
        <div class="card">
            <h2>📝 Registrar Nuevo Equipo 🖥️</h2>
            <form id="deviceForm">
                <div class="form-row">
                    <div class="form-group">
                        <label> Nombre del Equipo *</label>
                        <input type="text" id="nombre_equipo" required>
                    </div>
                    <div class="form-group">
                        <label>🔌 Tipo de Acceso *</label>
                        <select id="tipo_acceso" required>
                            <option value="AnyDesk">🖥️ AnyDesk</option>
                            <option value="RustDesk">💻 RustDesk</option>
                            <option value="AirDroid">📱 AirDroid</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label> ID (AnyDesk/RustDesk) o Usuario (AirDroid) *</label>
                        <input type="text" id="identificador" required>
                    </div>
                    <div class="form-group">
                        <label>🔒 Contraseña (Opcional)</label>
                        <input type="text" id="contrasena">
                    </div>
                </div>
                <div class="form-group">
                    <label>📝 Notas (Opcional)</label>
                    <textarea id="notas" rows="2"></textarea>
                </div>
                <button type="submit"> Guardar Equipo 🖥️</button>
            </form>
        </div>
        
        <!-- Lista de dispositivos -->
        <div class="card">
            <h2>📋 Equipos Registrados 💻</h2>
            <div id="devicesList">
                <div class="loading">⏳ Cargando dispositivos...</div>
            </div>
        </div>
    </div>

    <!-- Modal de Edición -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>️ Editar Equipo 🖥️</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="editForm">
                <input type="hidden" id="edit_id">
                <div class="form-row">
                    <div class="form-group">
                        <label>💻 Nombre del Equipo *</label>
                        <input type="text" id="edit_nombre_equipo" required>
                    </div>
                    <div class="form-group">
                        <label>🔌 Tipo de Acceso *</label>
                        <select id="edit_tipo_acceso" required>
                            <option value="AnyDesk">🖥️ AnyDesk</option>
                            <option value="RustDesk">💻 RustDesk</option>
                            <option value="AirDroid">📱 AirDroid</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>🆔 ID (AnyDesk/RustDesk) o Usuario (AirDroid) *</label>
                        <input type="text" id="edit_identificador" required>
                    </div>
                    <div class="form-group">
                        <label>🔒 Contraseña (Opcional)</label>
                        <input type="text" id="edit_contrasena">
                    </div>
                </div>
                <div class="form-group">
                    <label>📝 Notas (Opcional)</label>
                    <textarea id="edit_notas" rows="2"></textarea>
                </div>
                <button type="submit">💾 Actualizar Equipo ️</button>
            </form>
        </div>
    </div>

    <script>
        // ⚠️ CONFIGURACIÓN - REEMPLAZA ESTOS VALORES
        const SUPABASE_URL = 'https://ebcmehqzyvzgdjfwhuif.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_4QS8UET1F-ZuA7e5DpWSgg_TGAOz1TC'; // ← REEMPLAZA ESTO
        
        // Verificar configuración
        function checkConfiguration() {
            const statusDiv = document.getElementById('statusMessages');
            
            if (SUPABASE_KEY === 'TU_CLAVE_PUBLISHABLE_AQUI' || SUPABASE_KEY.includes('...')) {
                statusDiv.innerHTML = `
                    <div class="error-box">
                        <h3>⚠️ Error de Configuración</h3>
                        <p>La SUPABASE_KEY no está configurada correctamente.</p>
                        <p><strong>Clave actual:</strong> ${SUPABASE_KEY}</p>
                        <p>Debes reemplazarla con tu clave real de Supabase (empieza con "sb_publishable_")</p>
                    </div>
                `;
                return false;
            }
            
            statusDiv.innerHTML = `
                <div class="status-box">
                    <h3>✅ Configuración OK</h3>
                    <p>URL: ${SUPABASE_URL}</p>
                    <p>Conectando a Supabase...</p>
                </div>
            `;
            return true;
        }
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        // Mostrar mensajes
        function showMessage(type, message) {
            const statusDiv = document.getElementById('statusMessages');
            const boxClass = type === 'error' ? 'error-box' : type === 'success' ? 'success-box' : 'status-box';
            statusDiv.innerHTML = `<div class="${boxClass}"><h3>${message}</h3></div>`;
            setTimeout(() => { statusDiv.innerHTML = ''; }, 5000);
        }
        
        // Cargar dispositivos al iniciar
        async function loadDevices() {
            try {
                const { data, error } = await supabase
                    .from('dispositivos')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (error) {
                    console.error('Error al cargar:', error);
                    document.getElementById('devicesList').innerHTML = `
                        <div class="error-box">
                            <h3>❌ Error al cargar dispositivos</h3>
                            <p><strong>Código:</strong> ${error.code}</p>
                            <p><strong>Mensaje:</strong> ${error.message}</p>
                            <p><strong>Detalle:</strong> ${error.details || 'N/A'}</p>
                            <p style="margin-top: 10px;"><strong>Posibles causas:</strong></p>
                            <ul style="margin-left: 20px;">
                                <li>La tabla 'dispositivos' no existe en Supabase</li>
                                <li>La SUPABASE_KEY es incorrecta</li>
                                <li>No ejecutaste el SQL para crear la tabla</li>
                            </ul>
                        </div>
                    `;
                    return;
                }
                
                if (data.length === 0) {
                    document.getElementById('devicesList').innerHTML = '<div class="empty-state">🖥️ No hay equipos registrados aún</div>';
                    return;
                }
                
                displayDevices(data);
            } catch (err) {
                console.error('Error inesperado:', err);
                document.getElementById('devicesList').innerHTML = `
                    <div class="error-box">
                        <h3>❌ Error inesperado</h3>
                        <p>${err.message}</p>
                    </div>
                `;
            }
        }
        
        function displayDevices(devices) {
            const html = devices.map(device => `
                <div class="device-card">
                    <div class="action-buttons">
                        <button class="edit-btn" onclick="openEditModal(${device.id}, '${device.nombre_equipo}', '${device.tipo_acceso}', '${device.identificador}', '${device.contrasena || ''}', '${device.notas || ''}')">✏️ Editar</button>
                        <button class="delete-btn" onclick="deleteDevice(${device.id})">🗑️ Eliminar</button>
                    </div>
                    <div class="device-header">
                        <div class="device-name">🖥️ ${device.nombre_equipo}</div>
                        <span class="badge badge-${device.tipo_acceso.toLowerCase()}">${device.tipo_acceso}</span>
                    </div>
                    <div class="device-info">
                        <div class="info-item">
                            <span class="info-label">${device.tipo_acceso === 'AirDroid' ? '👤 Usuario:' : '🆔 ID:'}</span>
                            <span class="info-value" onclick="copyToClipboard('${device.identificador}')">${device.identificador} 📋</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label"> Contraseña:</span>
                            <span class="info-value" onclick="copyToClipboard('${device.contrasena || ''}')">${device.contrasena || 'Sin contraseña'} 📋</span>
                        </div>
                    </div>
                    ${device.notas ? `<div class="notes">📝 ${device.notas}</div>` : ''}
                </div>
            `).join('');
            
            document.getElementById('devicesList').innerHTML = html;
        }
        
        // Guardar nuevo dispositivo
        document.getElementById('deviceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const device = {
                nombre_equipo: document.getElementById('nombre_equipo').value,
                tipo_acceso: document.getElementById('tipo_acceso').value,
                identificador: document.getElementById('identificador').value,
                contrasena: document.getElementById('contrasena').value,
                notas: document.getElementById('notas').value
            };
            
            console.log('Guardando dispositivo:', device);
            
            const { data, error } = await supabase.from('dispositivos').insert([device]).select();
            
            if (error) {
                console.error('Error al guardar:', error);
                showMessage('error', `❌ Error al guardar: ${error.message}`);
            } else {
                document.getElementById('deviceForm').reset();
                showMessage('success', '✅ Equipo guardado exitosamente');
                loadDevices();
            }
        });
        
        // Abrir modal de edición
        function openEditModal(id, nombre, tipo, identificador, contrasena, notas) {
            document.getElementById('edit_id').value = id;
            document.getElementById('edit_nombre_equipo').value = nombre;
            document.getElementById('edit_tipo_acceso').value = tipo;
            document.getElementById('edit_identificador').value = identificador;
            document.getElementById('edit_contrasena').value = contrasena;
            document.getElementById('edit_notas').value = notas;
            document.getElementById('editModal').style.display = 'block';
        }
        
        // Cerrar modal
        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }
        
        // Cerrar modal al hacer clic fuera
        window.onclick = function(event) {
            const modal = document.getElementById('editModal');
            if (event.target == modal) {
                closeModal();
            }
        }
        
        // Actualizar dispositivo
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('edit_id').value;
            const device = {
                nombre_equipo: document.getElementById('edit_nombre_equipo').value,
                tipo_acceso: document.getElementById('edit_tipo_acceso').value,
                identificador: document.getElementById('edit_identificador').value,
                contrasena: document.getElementById('edit_contrasena').value,
                notas: document.getElementById('edit_notas').value
            };
            
            const { error } = await supabase.from('dispositivos').update(device).eq('id', id);
            
            if (error) {
                showMessage('error', `❌ Error al actualizar: ${error.message}`);
            } else {
                closeModal();
                showMessage('success', '✅ Equipo actualizado exitosamente');
                loadDevices();
            }
        });
        
        // Eliminar dispositivo
        async function deleteDevice(id) {
            if (confirm('¿Estás seguro de eliminar este registro?')) {
                const { error } = await supabase.from('dispositivos').delete().eq('id', id);
                if (!error) {
                    showMessage('success', '✅ Equipo eliminado exitosamente');
                    loadDevices();
                } else {
                    showMessage('error', `❌ Error al eliminar: ${error.message}`);
                }
            }
        }
        
        // Copiar al portapapeles
        function copyToClipboard(text) {
            if (!text) {
                showMessage('error', '️ No hay texto para copiar');
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                showMessage('success', `✅ Copiado: ${text}`);
            });
        }
        
        // Inicializar
        checkConfiguration();
        loadDevices();
    </script>
</body>
</html>
