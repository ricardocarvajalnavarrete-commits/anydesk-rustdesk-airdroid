
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gestor Remoto</title>
    <style>
        body { font-family: Arial; background: linear-gradient(135deg, #667eea, #764ba2); padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
        h1 { color: white; text-align: center; }
        input, select, textarea { width: 100%; padding: 10px; margin: 5px 0 15px 0; }
        button { background: #667eea; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; width: 100%; }
        .device { background: #f5f5f5; padding: 15px; margin: 10px 0; border-left: 4px solid #667eea; border-radius: 5px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d1fae5; color: #065f46; }
        .error { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <h1>🖥️ Gestor de Accesos Remotos</h1>
    <div class="container">
        <div id="status" class="status">🔄 Conectando...</div>
        
        <h2>📝 Nuevo Equipo</h2>
        <form id="form">
            <input id="nombre" placeholder="Nombre del equipo *" required>
            <select id="tipo" required>
                <option value="AnyDesk">AnyDesk</option>
                <option value="RustDesk">RustDesk</option>
                <option value="AirDroid">AirDroid</option>
            </select>
            <input id="id" placeholder="ID o Usuario *" required>
            <input id="pass" placeholder="Contraseña (opcional)">
            <textarea id="notas" placeholder="Notas"></textarea>
            <button type="submit">💾 Guardar</button>
        </form>
        
        <h2> Equipos</h2>
        <div id="lista">Cargando...</div>
    </div>

    <script>
        const URL = 'https://ebcmehqzyvzgdjfwhuif.supabase.co';
        const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImViY21laGd6eXZ6Z2RmandodWlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1MDgwMjUsImV4cCI6MjEwMzA4NDAyNX0.ACt5JbcBe0b3i48pQKZ9vr9L76-FsVbTJjtnEH_0lSc';
        
        const headers = {
            'apikey': KEY,
            'Authorization': 'Bearer ' + KEY,
            'Content-Type': 'application/json'
        };
        
        async function cargar() {
            try {
                const r = await fetch(URL + '/rest/v1/dispositivos?select=*', { headers });
                if (!r.ok) throw new Error('Error ' + r.status);
                const data = await r.json();
                document.getElementById('status').innerHTML = '✅ Conectado (' + data.length + ' equipos)';
                document.getElementById('status').className = 'status success';
                
                if (data.length === 0) {
                    document.getElementById('lista').innerHTML = '<p>Sin equipos</p>';
                    return;
                }
                
                document.getElementById('lista').innerHTML = data.map(d => 
                    '<div class="device"><b>' + d.nombre_equipo + '</b> (' + d.tipo_acceso + ')<br>' +
                    'ID: ' + d.identificador + '<br>' +
                    '<button onclick="eliminar(' + d.id + ')">🗑️ Eliminar</button></div>'
                ).join('');
            } catch (e) {
                document.getElementById('status').innerHTML = '❌ ' + e.message;
                document.getElementById('status').className = 'status error';
            }
        }
        
        document.getElementById('form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const data = {
                nombre_equipo: document.getElementById('nombre').value,
                tipo_acceso: document.getElementById('tipo').value,
                identificador: document.getElementById('id').value,
                contrasena: document.getElementById('pass').value,
                notas: document.getElementById('notas').value
            };
            
            try {
                const r = await fetch(URL + '/rest/v1/dispositivos', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify([data])
                });
                if (!r.ok) throw new Error('Error al guardar');
                alert('✅ Guardado');
                document.getElementById('form').reset();
                cargar();
            } catch (e) {
                alert('❌ ' + e.message);
            }
        });
        
        async function eliminar(id) {
            if (!confirm('¿Eliminar?')) return;
            try {
                const r = await fetch(URL + '/rest/v1/dispositivos?id=eq.' + id, {
                    method: 'DELETE',
                    headers: headers
                });
                if (!r.ok) throw new Error('Error');
                alert('✅ Eliminado');
                cargar();
            } catch (e) {
                alert('❌ ' + e.message);
            }
        }
        
        cargar();
    </script>
</body>
</html>
